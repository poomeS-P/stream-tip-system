services:
  db:
    image: postgres:16-alpine
    container_name: stream_tip_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      # รหัสผ่านไม่ถูกเก็บในไฟล์นี้ — compose อ่านจาก .env (ดู .env.example)
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD ต้องถูกตั้งใน .env (dev เท่านั้น)}
      POSTGRES_DB: ${POSTGRES_DB:-stream_tip_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-stream_tip_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stream_tip_app
    restart: unless-stopped
    ports:
      - "3300:3000"
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD ต้องถูกตั้งใน .env}@db:5432/${POSTGRES_DB:-stream_tip_db}?schema=public"
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3300}
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      OVERLAY_TOKEN: ${OVERLAY_TOKEN}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
      DEFAULT_CURRENCY: ${DEFAULT_CURRENCY:-THB}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
